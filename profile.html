<!DOCTYPE html>
<html lang="en" data-app="site">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Teacher profile — Teacher Tools</title>
<script src="app-core.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF;
  --text:#0F0F0F;
  --muted:#606060;
  --soft:#8A8A8A;
  --chip:#F2F2F2;
  --line:#E5E5E5;
  --red:#FF0033;
  --bar-h:64px;
  --font:"Roboto","Inter","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;min-width:320px;
  background:var(--bg);color:var(--text);
  font-family:var(--font);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
::selection{background:var(--text);color:#fff}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
svg{display:block}
h1,h2,h3,p{overflow-wrap:break-word}
.icon{
  width:20px;height:20px;flex:none;
  fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;
}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus-visible{outline:2px solid #0F0F0F;outline-offset:3px;border-radius:8px}

/* ---------- Bar ---------- */
.profile-bar{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;gap:14px;
  height:var(--bar-h);padding:0 24px;
  background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(10px);
}
.doc-logo{
  width:92px;height:34px;flex:none;
  display:flex;align-items:center;justify-content:center;
  border:1.5px dashed #F2B7C2;border-radius:9px;
  background:#FFF7F8;color:var(--red);
  font-size:9.5px;font-weight:700;letter-spacing:.16em;
  transition:background .18s ease,border-color .18s ease;
}
.doc-logo:hover{background:#FFF0F3;border-color:var(--red)}
.bar-sep{width:1px;height:22px;background:var(--line);flex:none}
.bar-back{
  display:inline-flex;align-items:center;gap:6px;
  height:38px;padding:0 14px 0 10px;border-radius:999px;
  font-size:14px;font-weight:500;color:#3C3C3C;
  transition:background .16s ease,color .16s ease;
}
.bar-back:hover{background:var(--chip);color:var(--text)}
.bar-back .icon{width:17px;height:17px}
.bar-spacer{flex:1}
.bar-label{font-size:13px;color:var(--muted);white-space:nowrap}

/* ---------- Page ---------- */
.profile-page{max-width:1280px;margin:0 auto;padding:40px 40px 96px}
.profile-hero{
  display:flex;align-items:center;gap:24px;
  padding:4px 0 30px;
  border-bottom:1px solid var(--line);
}
.profile-avatar{
  width:104px;height:104px;flex:none;
  border-radius:50%;
  display:grid;place-items:center;overflow:hidden;
  font-size:34px;font-weight:700;letter-spacing:.02em;
  box-shadow:inset 0 0 0 1px rgba(15,15,15,.06),0 10px 30px rgba(15,15,15,.08);
}
.profile-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.profile-intro{min-width:0}
.eyebrow{
  margin:0 0 6px;
  font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#8A8A8A;
}
.profile-intro h1{
  margin:0;font-size:clamp(28px,3.6vw,40px);font-weight:700;line-height:1.1;letter-spacing:-.03em;
}
.profile-role{margin:9px 0 0;font-size:15px;color:var(--muted)}
.edit-profile-btn{
  margin-left:auto;flex:none;
  display:inline-flex;align-items:center;gap:8px;
  height:42px;padding:0 18px;border-radius:999px;
  background:#fff;border:1px solid #E0E0E0;color:var(--text);
  font-size:14px;font-weight:600;
  transition:background .16s ease,border-color .16s ease;
}
.edit-profile-btn:hover{background:#F6F6F6;border-color:#D2D2D2}
.edit-profile-btn .icon{width:16px;height:16px}

.profile-facts{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;max-width:560px;margin-top:26px;
}
.fact{
  border:1px solid #F0F0F0;background:#FAFAFA;border-radius:16px;
  padding:16px 18px;
}
.fact span{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#8A8A8A}
.fact span .icon{width:15px;height:15px;stroke-width:2;color:#9A9A9A}
.fact strong{display:block;margin-top:7px;font-size:27px;font-weight:700;letter-spacing:-.02em}

.about{max-width:760px;margin-top:34px}
.about h2{margin:0 0 10px;font-size:19px;font-weight:600;letter-spacing:-.015em}
.about p{margin:0;font-size:15.5px;line-height:1.65;color:#3A3A3A}
.about-note{margin:12px 0 0;font-size:12.5px;color:#9A9A9A}

.products{margin-top:52px}
.products-head{
  display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  margin-bottom:22px;
}
.products-head h2{margin:0;font-size:21px;font-weight:600;letter-spacing:-.02em}
.products-head span{font-size:13.5px;color:var(--muted)}

/* ---------- Edit profile dialog ---------- */
body.modal-open{overflow:hidden}
.edit-modal{
  width:min(520px,calc(100vw - 32px));
  max-height:calc(100vh - 48px);
  padding:0;border:0;border-radius:20px;
  background:#fff;color:var(--text);
  box-shadow:0 30px 80px rgba(15,15,15,.24);
  overflow:auto;
}
.edit-modal::backdrop{background:rgba(15,15,15,.46);backdrop-filter:blur(2px)}
.edit-modal[open]{animation:modalIn .18s ease both}
@keyframes modalIn{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
.edit-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
  padding:22px 24px 0;
}
.edit-head h2{margin:0;font-size:20px;font-weight:600;letter-spacing:-.02em}
.edit-head p{margin:6px 0 0;font-size:13.5px;color:var(--muted)}
.modal-close{
  width:36px;height:36px;border-radius:50%;flex:none;
  display:grid;place-items:center;color:#5A5A5A;
  transition:background .16s ease,color .16s ease;
}
.modal-close:hover{background:var(--chip);color:var(--text)}
.modal-close .icon{width:19px;height:19px}
.edit-body{display:flex;flex-direction:column;gap:18px;padding:22px 24px 4px}
.avatar-field{display:flex;align-items:center;gap:16px}
.edit-avatar{
  width:72px;height:72px;flex:none;border-radius:50%;overflow:hidden;
  display:grid;place-items:center;
  font-size:22px;font-weight:700;letter-spacing:.02em;
  box-shadow:inset 0 0 0 1px rgba(15,15,15,.06);
}
.edit-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.avatar-actions{min-width:0}
.field-label{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8A8A8A}
.avatar-btns{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.btn-ghost{
  height:36px;padding:0 14px;border-radius:999px;
  border:1px solid #E0E0E0;background:#fff;
  font-size:13px;font-weight:600;
  transition:background .16s ease;
}
.btn-ghost:hover{background:#F6F6F6}
.field{display:block}
.field input,.field textarea{
  width:100%;margin-top:7px;padding:11px 13px;
  border:1px solid #E1E1E1;border-radius:11px;background:#fff;
  font:400 14.5px/1.45 var(--font);color:var(--text);
  transition:border-color .16s ease,box-shadow .16s ease;
}
.field textarea{resize:vertical;min-height:104px}
.field input:focus,.field textarea:focus{outline:0;border-color:#0F0F0F;box-shadow:0 0 0 3px rgba(15,15,15,.06)}
.field-hint{display:block;margin-top:6px;font-size:12px;color:#9A9A9A}
.edit-error{
  margin:0;padding:10px 12px;border-radius:10px;
  background:#FFF0F3;border:1px solid #FFCED8;
  font-size:13px;color:#C50028;
}
.edit-foot{display:flex;justify-content:flex-end;gap:10px;padding:20px 24px 22px}
.btn-primary,.btn-secondary{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:42px;padding:0 18px;border-radius:999px;
  font-size:14px;font-weight:600;
  transition:background .18s ease,border-color .18s ease;
}
.btn-primary{background:#0F0F0F;color:#fff}
.btn-primary:hover{background:#2A2A2A}
.btn-secondary{background:#fff;border:1px solid #E0E0E0;color:var(--text)}
.btn-secondary:hover{background:#F6F6F6}

/* ---------- Toast ---------- */
.toast{
  position:fixed;left:50%;bottom:28px;z-index:400;
  display:flex;align-items:center;gap:8px;
  max-width:calc(100vw - 32px);
  padding:11px 18px;border-radius:999px;
  background:#0F0F0F;color:#fff;
  box-shadow:0 14px 34px rgba(0,0,0,.24);
  font-size:13.5px;font-weight:500;
  opacity:0;pointer-events:none;
  transform:translate(-50%,14px);
  transition:opacity .22s ease,transform .22s ease;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast .icon{width:16px;height:16px;color:#63E6A8;stroke-width:2.2}

/* ---------- Product grid ---------- */
.tool-grid{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  column-gap:20px;row-gap:46px;
}
.tool-card{
  min-width:0;cursor:pointer;
  animation:cardIn .42s cubic-bezier(.2,.7,.3,1) both;
  animation-delay:calc(var(--i,0) * 34ms);
}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.thumb{
  position:relative;display:block;width:100%;aspect-ratio:16/9;
  padding:0;overflow:hidden;border-radius:16px;
  background:#F2F2F2;isolation:isolate;
  box-shadow:inset 0 0 0 1px rgba(15,15,15,.035);
  transition:box-shadow .3s ease,transform .3s ease;
}
.tool-card:hover .thumb{box-shadow:0 14px 34px rgba(15,15,15,.13),inset 0 0 0 1px rgba(15,15,15,.035)}
.art-svg{width:100%;height:100%;display:block;transition:transform .5s cubic-bezier(.2,.7,.3,1)}
.tool-card:hover .art-svg{transform:scale(1.025)}
.thumb-cta{
  position:absolute;left:14px;bottom:14px;z-index:2;
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 12px;border-radius:999px;
  background:rgba(255,255,255,.95);color:#0F0F0F;
  box-shadow:0 4px 18px rgba(15,15,15,.12);
  font-size:12.5px;font-weight:600;
  opacity:0;transform:translateY(6px);
  transition:opacity .2s ease,transform .2s ease;
  backdrop-filter:blur(8px);
}
.thumb-cta .icon{width:14px;height:14px;stroke-width:2}
.tool-card:hover .thumb-cta,.thumb:focus-visible .thumb-cta{opacity:1;transform:none}
.pcard-info{padding-top:14px}
.tool-header{display:flex;align-items:flex-start;gap:6px}
.tool-title-btn{
  flex:1;min-width:0;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  text-align:left;
  font-size:18px;font-weight:600;line-height:1.32;letter-spacing:-.014em;color:#0F0F0F;
}
.tool-title-btn:hover{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px}
.tool-meta{
  margin:5px 0 0;display:flex;align-items:center;flex-wrap:wrap;gap:6px;
  font-size:14px;line-height:1.4;color:var(--muted);
}
.tool-meta .sep{color:#B3B3B3}

.profile-empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:56px 24px 64px;
  border:1px dashed var(--line);border-radius:20px;
}
.profile-empty strong{font-size:16px;font-weight:600}
.profile-empty span{margin-top:6px;font-size:14px;color:var(--muted)}
.not-found{max-width:560px;margin:96px auto 0;text-align:center;padding:0 24px}
.not-found h1{margin:0;font-size:32px;letter-spacing:-.03em}
.not-found p{margin:12px 0 24px;color:var(--muted)}
.not-found a{
  display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 20px;
  border-radius:999px;background:#0F0F0F;color:#fff;
  font-size:14.5px;font-weight:600;transition:background .18s ease;
}
.not-found a:hover{background:#2A2A2A}
.profile-loading{padding:80px 0;text-align:center;color:var(--muted);font-size:14.5px}

/* ---------- Responsive ---------- */
@media (max-width:1180px){
  .tool-grid{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:40px}
}
@media (max-width:900px){
  .profile-page{padding:32px 24px 80px}
}
@media (max-width:700px){
  .tool-grid{grid-template-columns:minmax(0,1fr);row-gap:36px}
  .profile-hero{flex-wrap:wrap}
  .edit-profile-btn{margin-left:0;order:3;width:100%;justify-content:center}
}
@media (max-width:560px){
  .profile-bar{padding:0 14px;gap:10px}
  .doc-logo{width:62px;height:32px;font-size:7.5px;letter-spacing:.1em}
  .bar-label{display:none}
  .bar-back{padding:0 12px 0 8px;font-size:13.5px}
  .profile-page{padding:28px 20px 72px}
  .profile-hero{gap:16px;padding-bottom:24px}
  .profile-avatar{width:76px;height:76px;font-size:25px}
  .profile-role{font-size:14px}
  .profile-facts{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:22px}
  .fact{padding:13px 14px;border-radius:14px}
  .fact strong{font-size:23px}
  .about{margin-top:28px}
  .products{margin-top:40px}
  .thumb{border-radius:14px}
  .tool-title-btn{font-size:17px}
  .tool-meta{font-size:13.5px}
  .edit-head{padding:20px 20px 0}
  .edit-body{padding:20px 20px 4px;gap:16px}
  .edit-foot{padding:18px 20px 20px}
  .edit-foot .btn-primary,.edit-foot .btn-secondary{flex:1}
}
@media (hover:none){
  .thumb-cta{opacity:1;transform:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-delay:0ms !important;transition-duration:.001ms !important;scroll-behavior:auto !important}
}
</style>

  <symbol id="ic-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><path d="M16 5.2a3.2 3.2 0 0 1 0 5.6"/><path d="M17.5 14.4A5.5 5.5 0 0 1 21 20"/></symbol>

</svg>

<header class="profile-bar">
  <a class="doc-logo" href="index.html" aria-label="Teacher Tools home">LOGO</a>
  <span class="bar-sep" aria-hidden="true"></span>
  <a class="bar-back" href="index.html">
    <svg class="icon" aria-hidden="true"><use href="#ic-chev-left"/></svg>Back to Homepage
  </a>
  <span class="bar-spacer"></span>
  <span class="bar-label" id="barLabel">Teacher profile</span>
</header>

<main class="profile-page" id="profileRoot" aria-live="polite">
  <p class="profile-loading">Loading profile…</p>
</main>

<dialog class="edit-modal" id="editProfileModal" aria-labelledby="editProfileTitle">
  <form id="editProfileForm" novalidate>
    <div class="edit-head">
      <div>
        <h2 id="editProfileTitle">Edit profile</h2>
        <p>These details are visible to anyone who visits your public profile.</p>
      </div>
      <button class="modal-close" id="editProfileClose" type="button" aria-label="Close">
        <svg class="icon" aria-hidden="true"><use href="#ic-x"/></svg>
      </button>
    </div>
    <div class="edit-body">
      <div class="avatar-field">
        <span class="edit-avatar" id="editAvatarPreview" aria-hidden="true"></span>
        <div class="avatar-actions">
          <span class="field-label">Profile picture</span>
          <div class="avatar-btns">
            <button class="btn-ghost" id="avatarPick" type="button">Upload photo</button>
            <button class="btn-ghost" id="avatarRemove" type="button" hidden>Remove</button>
          </div>
          <p class="field-hint">PNG, JPG, or WebP up to 2 MB.</p>
          <input class="sr-only" id="avatarInput" type="file" accept="image/png,image/jpeg,image/webp" aria-label="Upload profile picture">
        </div>
      </div>
      <label class="field" for="editName">
        <span class="field-label">Username</span>
        <input id="editName" type="text" maxlength="60" autocomplete="name" required>
      </label>
      <div class="field-row">
        <label class="field" for="editOccupation">
          <span class="field-label">Occupation</span>
          <input id="editOccupation" type="text" maxlength="80" autocomplete="organization-title" placeholder="e.g. Science teacher">
        </label>
        <label class="field" for="editWorkplace">
          <span class="field-label">Workplace</span>
          <input id="editWorkplace" type="text" maxlength="80" autocomplete="organization" placeholder="e.g. Lincoln High School">
        </label>
      </div>
      <label class="share-field" for="editShareWork">
        <input id="editShareWork" type="checkbox">
        <span>Show my occupation and workplace on my public profile. Leave a field blank to hide it.</span>
      </label>
      <label class="field" for="editBio">
        <span class="field-label">About Me</span>
        <textarea id="editBio" rows="5" maxlength="400"></textarea>
        <span class="field-hint"><span id="bioCount">0</span>/400 · Shown on your public profile.</span>
      </label>
      <p class="edit-error" id="editError" role="alert" hidden></p>
    </div>
    <div class="edit-foot">
      <button class="btn-secondary" id="editCancel" type="button">Cancel</button>
      <button class="btn-primary" id="editSave" type="submit">Save Changes</button>
    </div>
  </form>
</dialog>

<div class="toast" id="profileToast" role="status" aria-live="polite">
  <svg class="icon" aria-hidden="true"><use href="#ic-check"/></svg>
  <span id="profileToastText"></span>
</div>

<script>
const DEFAULT_USER_ID = 'alex';

const TOOLS = {
  listening:         { label:'IELTS Listening', group:'ielts' },

  'toeic-speaking':  { label:'TOEIC Speaking', group:'toeic' },
  'multiple-choice': { label:'Multiple Choice', group:'general' },
  'drag-drop':       { label:'Drag & Drop', group:'general' },
  'gap-filling':     { label:'Gap-filling', group:'general' },
  graduation:        { label:'Graduation Test', group:'others' },
  lesson:            { label:'Lesson', group:'lessons' }
};

const USERS = {
  maya:   { name:'Maya Chen',     initials:'MC', role:'Biology teacher',  school:'Northfield High School', bg:'#E4F2EA', fg:'#1E7A5A', followers:126,
            bio:'Biology teacher at Northfield High School. I turn dense science units into hands-on labs, quick checks, and review games students actually enjoy.' },
  daniel: { name:'Daniel Okafor', initials:'DO', role:'History teacher',  school:'Northfield High School', bg:'#ECEAFD', fg:'#5B4BE0', followers:98,
            bio:'History teacher at Northfield High School. I build document-based exams and projects that help students think like historians.' },
  priya:  { name:'Priya Raman',   initials:'PR', role:'Math teacher',     school:'Riverside Academy',     bg:'#FBEFE4', fg:'#B45B16', followers:214,
            bio:'Math teacher at Riverside Academy. I write differentiated practice sets and visual lessons that make abstract ideas concrete.' },

const escapeHTML = (value) => String(value).replace(/[&<>"']/g, (ch) => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
}[ch]));

const artHTML = (type) => `<svg class="art-svg" viewBox="0 0 640 360" aria-hidden="true" focusable="false">${ART[type] || ART.reading}</svg>`;

const contentURL = (id) => `index.html#content=${encodeURIComponent(id)}`;

const CURRENT_USER_ID = DEFAULT_USER_ID;
const AVATAR_MAX_BYTES = 2 * 1024 * 1024;

const viewsLabel = (views) => {
  const count = Number(views) || 0;
  return `${count.toLocaleString('en-US')} ${count === 1 ? 'view' : 'views'}`;
};

const initialsFor = (name) => {
  const parts = String(name || '').trim().split(/\s+/).filter(Boolean).slice(0, 2);
  return parts.map((part) => part[0]).join('').toUpperCase() || '?';
};

function relativeTime(timestamp) {
  const time = Number(timestamp) || 0;
  if (!time) return 'recently';
  const diff = Math.max(0, Date.now() - time);
  const minutes = Math.floor(diff / 60000);
  if (minutes < 1) return 'just now';
  if (minutes < 60) return `${minutes} minute${minutes === 1 ? '' : 's'} ago`;
  const hours = Math.floor(minutes / 60);
  if (hours < 24) return `${hours} hour${hours === 1 ? '' : 's'} ago`;
  const days = Math.floor(hours / 24);
  if (days < 30) return `${days} day${days === 1 ? '' : 's'} ago`;
  return new Date(time).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

/*
 * Data-access seam. Everything the page renders comes through ProfileAPI, so a
 * real backend (session user + contents table) can replace the sample lookups
 * without touching the render layer.
 */
const ProfileAPI = {
  async getUser(id) {
    const base = USERS[id];
    if (!base) return null;
    const saved = TeacherTools.profiles.get(id) || {};
    const has = (key) => Object.prototype.hasOwnProperty.call(saved, key);
    const name = has('name') ? saved.name : base.name;
    return {
      ...base,
      ...saved,
      id,
      name,
      initials: initialsFor(name),
      occupation: String(has('occupation') ? saved.occupation : base.role).trim(),
      workplace: String(has('workplace') ? saved.workplace : base.school).trim(),
      shareWork: saved.shareWork !== false,
      bio: typeof saved.bio === 'string' ? saved.bio : base.bio,
      avatar: saved.avatar || null
    };
  },
  async getContents(id) {
    const published = TeacherTools.publishing.listByCreator(id).map((item) => ({
      ...item,
      updated: relativeTime(item.updatedAt)
    }));
    return published;
  },
  async updateUser(id, patch) {
    if (id !== CURRENT_USER_ID || TeacherTools.session.getUserId() !== id) {
      throw new Error('You can only edit your own profile.');
    }
    const base = USERS[id];
    if (!base) throw new Error('Profile not found.');

    const next = {};
    if ('name' in patch) {
      const name = String(patch.name || '').trim();
      if (!name) throw new Error('Please enter a username.');
      next.name = name;
    }
    if ('bio' in patch) next.bio = String(patch.bio || '').trim();
    if ('occupation' in patch) next.occupation = String(patch.occupation || '').trim();
    if ('workplace' in patch) next.workplace = String(patch.workplace || '').trim();
    if ('shareWork' in patch) next.shareWork = !!patch.shareWork;
    if ('avatar' in patch) next.avatar = patch.avatar || null;

    try {
      TeacherTools.profiles.save(id, next);
    } catch {
      throw new Error('Could not save changes on this device. Try a smaller photo.');
    }
    return this.getUser(id);
  }
};

const avatarInner = (user) => user.avatar
  ? `<img src="${escapeHTML(user.avatar)}" alt="">`
  : escapeHTML(user.initials);

function contentCardHTML(item, index) {
  const tool = TOOLS[item.tool] || { label:'Content' };
  const href = contentURL(item.id);
  return `
    <article class="tool-card" data-content-id="${escapeHTML(item.id)}" style="--i:${index}">
      <a class="thumb" href="${href}" target="_blank" rel="noopener" aria-label="Open “${escapeHTML(item.title)}” in a new tab">
        ${artHTML(item.art)}
        <span class="thumb-cta" aria-hidden="true"><svg class="icon"><use href="#ic-maximize"/></svg>Open</span>
      </a>
      <div class="pcard-info">
        <div class="tool-header">
          <a class="tool-title-btn" href="${href}" target="_blank" rel="noopener" aria-label="Open “${escapeHTML(item.title)}” in a new tab">${escapeHTML(item.title)}</a>
        </div>
        <p class="tool-meta">
          <span>${escapeHTML(tool.label)}</span>
          <span class="sep" aria-hidden="true">·</span>
          <span>${viewsLabel(item.views)}</span>
        </p>
      </div>
    </article>`;
}

function contentsSectionHTML(contents) {
  if (!contents.length) {
    return `
      <section class="products" aria-labelledby="contentsHeading">
        <div class="products-head">
          <h2 id="contentsHeading">Contents</h2>
          <span>0 items</span>
        </div>
        <div class="profile-empty">
          <strong>No contents shared yet</strong>
          <span>When this teacher publishes a resource it will appear here.</span>
        </div>
      </section>`;
  }
  return `
    <section class="products" aria-labelledby="contentsHeading">
      <div class="products-head">
        <h2 id="contentsHeading">Contents</h2>
        <span>${contents.length} ${contents.length === 1 ? 'item' : 'items'}</span>
      </div>
      <div class="tool-grid">${contents.map(contentCardHTML).join('')}</div>
    </section>`;
}

function workLineHTML(user) {
  if (user.shareWork === false) return '';
  const parts = [user.occupation, user.workplace].filter(Boolean).map(escapeHTML);
  return parts.length ? `<p class="profile-role">${parts.join(' · ')}</p>` : '';
}

function profileHTML(user, contents, canEdit) {
  const count = contents.length;
  return `
    <section class="profile-hero" aria-labelledby="profileName">
      <span class="profile-avatar" style="background:${user.bg};color:${user.fg}" aria-hidden="true">${avatarInner(user)}</span>
      <div class="profile-intro">
        <h1 id="profileName">${escapeHTML(user.name)}</h1>
        ${workLineHTML(user)}
      </div>
      ${canEdit ? `
      <div class="profile-actions">
        <button class="edit-profile-btn" id="editProfileBtn" type="button">
          <svg class="icon" aria-hidden="true"><use href="#ic-pen"/></svg>Edit Profile
        </button>
        <button class="signout-btn" id="signOutBtn" type="button">
          <svg class="icon" aria-hidden="true"><use href="#ic-logout"/></svg>Sign Out
        </button>
      </div>` : ''}
    </section>

    <section class="profile-facts" aria-label="Profile statistics">
      <div class="fact">
        <span><svg class="icon" aria-hidden="true"><use href="#ic-layers"/></svg>Contents created</span>
        <strong>${count}</strong>
      </div>
      <div class="fact">
        <span><svg class="icon" aria-hidden="true"><use href="#ic-users"/></svg>Followers</span>
        <strong>${Number(user.followers || 0).toLocaleString('en-US')}</strong>
      </div>
    </section>

    <section class="about" aria-labelledby="aboutHeading">
      <h2 id="aboutHeading">About Me</h2>
      <p>${user.bio ? escapeHTML(user.bio) : 'No bio added yet.'}</p>
      <p class="about-note">Only information this teacher has chosen to share publicly is shown.</p>
    </section>

    ${contentsSectionHTML(contents)}`;
}

function notFoundHTML(id) {
  return `
    <div class="not-found">
      <h1>Profile not found</h1>
      <p>We couldn’t find a teacher account for “${escapeHTML(id)}”. The link may be out of date.</p>
      <a href="index.html">Back to Homepage</a>
    </div>`;
}

const profileRoot = document.getElementById('profileRoot');
const editModal = document.getElementById('editProfileModal');
const editForm = document.getElementById('editProfileForm');
const editName = document.getElementById('editName');
const editOccupation = document.getElementById('editOccupation');
const editWorkplace = document.getElementById('editWorkplace');
const editShareWork = document.getElementById('editShareWork');
const editBio = document.getElementById('editBio');
const bioCount = document.getElementById('bioCount');
const editAvatarPreview = document.getElementById('editAvatarPreview');
const avatarInput = document.getElementById('avatarInput');
const avatarRemove = document.getElementById('avatarRemove');
const editError = document.getElementById('editError');
const editSave = document.getElementById('editSave');
const toast = document.getElementById('profileToast');
const toastText = document.getElementById('profileToastText');

let currentUser = null;
let currentContents = [];
let draftAvatar = null;
let toastTimer = null;

function canEditProfile(user) {
  return !!user && user.id === CURRENT_USER_ID && TeacherTools.session.getUserId() === user.id;
}

function renderProfile(user, contents) {
  currentUser = user;
  currentContents = contents;
  profileRoot.innerHTML = profileHTML(user, contents, canEditProfile(user));
  document.getElementById('barLabel').textContent = `${user.name} · Profile`;
  document.title = `${user.name} — Teacher Tools`;
}

async function loadProfile() {
  const requested = new URLSearchParams(location.search).get('user');
  const id = (requested || DEFAULT_USER_ID).trim();

  try {
    const [user, contents] = await Promise.all([
      ProfileAPI.getUser(id),
      ProfileAPI.getContents(id)
    ]);

    if (!user) {
      profileRoot.innerHTML = notFoundHTML(id);
      document.title = 'Profile not found — Teacher Tools';
      return;
    }

    renderProfile(user, contents);
  } catch {
    profileRoot.innerHTML = `
      <div class="not-found">
        <h1>Something went wrong</h1>
        <p>We couldn’t load this profile right now. Please try again.</p>
        <a href="index.html">Back to Homepage</a>
      </div>`;
    document.title = 'Profile unavailable — Teacher Tools';
  }
}

/* ---------- Edit profile ---------- */
function showEditError(message) {
  editError.textContent = message;
  editError.hidden = false;
}

function clearEditError() {
  editError.hidden = true;
  editError.textContent = '';
}

function renderDraftAvatar() {
  if (!currentUser) return;
  editAvatarPreview.style.background = currentUser.bg;
  editAvatarPreview.style.color = currentUser.fg;
  editAvatarPreview.innerHTML = draftAvatar
    ? `<img src="${escapeHTML(draftAvatar)}" alt="">`
    : escapeHTML(initialsFor(editName.value.trim() || currentUser.name));
  avatarRemove.hidden = !draftAvatar;
}

function openEditor() {
  if (!canEditProfile(currentUser)) return;
  draftAvatar = currentUser.avatar || null;
  editName.value = currentUser.name;
  editOccupation.value = currentUser.occupation || '';
  editWorkplace.value = currentUser.workplace || '';
  editShareWork.checked = currentUser.shareWork !== false;
  editBio.value = currentUser.bio || '';
  bioCount.textContent = String(editBio.value.length);
  clearEditError();
  renderDraftAvatar();
  if (typeof editModal.showModal === 'function') editModal.showModal();
  else editModal.setAttribute('open', '');
  document.body.classList.add('modal-open');
  editName.focus();
  editName.setSelectionRange(editName.value.length, editName.value.length);
}

function closeEditor() {
  if (editModal.open && typeof editModal.close === 'function') editModal.close();
  else editModal.removeAttribute('open');
  document.body.classList.remove('modal-open');
}

function readImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error('read-failed'));
    reader.readAsDataURL(file);
  });
}

async function toAvatarDataURL(file) {
  const source = await readImage(file);
  const image = await new Promise((resolve, reject) => {
    const element = new Image();
    element.onload = () => resolve(element);
    element.onerror = () => reject(new Error('decode-failed'));
    element.src = source;
  });

  const size = Math.min(image.width, image.height);
  const canvas = document.createElement('canvas');
  canvas.width = 320;
  canvas.height = 320;
  const context = canvas.getContext('2d');
  context.drawImage(
    image,
    (image.width - size) / 2,
    (image.height - size) / 2,
    size,
    size,
    0,
    0,
    320,
    320
  );
  return canvas.toDataURL('image/jpeg', 0.86);
}

function showToast(message) {
  toastText.textContent = message;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
}

profileRoot.addEventListener('click', (event) => {
  if (event.target.closest('#editProfileBtn')) {
    openEditor();
    return;
  }
  if (event.target.closest('#signOutBtn')) {
    TeacherTools.session.signOut();
    location.href = 'index.html#home';
    return;
  }
  if (event.target.closest('a, button')) return;
  const card = event.target.closest('[data-content-id]');
  if (card) window.open(contentURL(card.dataset.contentId), '_blank', 'noopener');
});

document.getElementById('editProfileClose').addEventListener('click', closeEditor);
document.getElementById('editCancel').addEventListener('click', closeEditor);
editModal.addEventListener('cancel', (event) => {
  event.preventDefault();
  closeEditor();
});
editModal.addEventListener('click', (event) => {
  if (event.target === editModal) closeEditor();
});

document.getElementById('avatarPick').addEventListener('click', () => avatarInput.click());

avatarRemove.addEventListener('click', () => {
  draftAvatar = null;
  avatarInput.value = '';
  renderDraftAvatar();
});

avatarInput.addEventListener('change', async () => {
  const file = avatarInput.files && avatarInput.files[0];
  avatarInput.value = '';
  if (!file) return;
  clearEditError();

  if (!/^image\/(png|jpeg|webp)$/.test(file.type)) {
    showEditError('Choose a PNG, JPG, or WebP image.');
    return;
  }
  if (file.size > AVATAR_MAX_BYTES) {
    showEditError('That image is larger than 2 MB. Choose a smaller file.');
    return;
  }

  try {
    draftAvatar = await toAvatarDataURL(file);
    renderDraftAvatar();
  } catch {
    showEditError('That image could not be read. Try another file.');
  }
});

editName.addEventListener('input', renderDraftAvatar);
editBio.addEventListener('input', () => {
  bioCount.textContent = String(editBio.value.length);
});

editForm.addEventListener('submit', async (event) => {
  event.preventDefault();
  clearEditError();

  const name = editName.value.trim();
  if (!name) {
    showEditError('Please enter a username.');
    editName.focus();
    return;
  }

  editSave.disabled = true;
  try {
    const updated = await ProfileAPI.updateUser(CURRENT_USER_ID, {
      name,
      occupation: editOccupation.value,
      workplace: editWorkplace.value,
      shareWork: editShareWork.checked,
      bio: editBio.value.trim(),
      avatar: draftAvatar
    });
    renderProfile(updated, currentContents);
    closeEditor();
    showToast('Profile updated');
  } catch (error) {
    showEditError(error.message || 'Could not save changes. Please try again.');
  } finally {
    editSave.disabled = false;
  }
});

window.addEventListener('storage', (event) => {
  if (event.key && event.key.startsWith('teacherTools.')) loadProfile();
});
window.addEventListener('teachertools:authchange', loadProfile);
window.addEventListener('teachertools:published', loadProfile);

loadProfile();
</script>
