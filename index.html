<!DOCTYPE html>
<html lang="en" data-app="site">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Teacher Tools — Build lessons, exercises, and assessments</title>
<script src="app-core.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF;
  --text:#0F0F0F;
  --muted:#606060;
  --soft:#8A8A8A;
  --chip:#F2F2F2;
  --line:#E5E5E5;
  --red:#FF0033;
  --header-h:64px;
  --sidebar-w:248px;
  --font:"Roboto","Inter","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;
  min-width:320px;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font);
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
::selection{background:var(--text);color:#fff}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input{font:inherit}
button,input{color:inherit}
a{color:inherit;text-decoration:none}
svg{display:block}
h1,h2,h3,p{overflow-wrap:break-word}
.icon{
  width:20px;height:20px;flex:none;
  fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;
}
.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
:focus-visible{outline:2px solid #0F0F0F;outline-offset:3px;border-radius:8px}

/* ---------- Header ---------- */
.topbar{
  position:fixed;inset:0 0 auto 0;height:var(--header-h);
  display:grid;
  grid-template-columns:var(--sidebar-w) minmax(0,1fr) auto;
  align-items:center;gap:24px;
  padding:0 24px;
  background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(10px);
  z-index:100;
}
.topbar-left{display:flex;align-items:center;gap:12px;min-width:0}
.logo-slot{
  width:132px;height:38px;flex:none;
  display:flex;align-items:center;justify-content:center;
  border:1.5px dashed #F2B7C2;border-radius:10px;
  background:#FFF7F8;color:var(--red);
  font-size:11px;font-weight:700;letter-spacing:.18em;
  transition:background .18s ease,border-color .18s ease;
}
.logo-slot:hover{background:#FFF0F3;border-color:var(--red)}
.menu-toggle{display:none;width:40px;height:40px;border-radius:10px;align-items:center;justify-content:center;color:var(--text)}
.menu-toggle:hover{background:var(--chip)}
.search-zone{display:flex;align-items:center;gap:10px;justify-content:center;min-width:0;width:100%;max-width:860px;margin:0 auto}
.search-shell{
  display:flex;align-items:center;flex:1;min-width:0;height:50px;
  padding:0 5px 0 20px;
  background:#fff;border:1px solid #E1E1E1;border-radius:999px;
  transition:border-color .18s ease,box-shadow .18s ease;
}
.search-shell:focus-within{border-color:#0F0F0F;box-shadow:0 0 0 3px rgba(15,15,15,.06)}
.search-input{
  flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;
  font-size:15.5px;color:var(--text);
}
.search-input::placeholder{color:#8A8A8A}
.search-submit{
  width:38px;height:38px;border-radius:50%;flex:none;
  display:grid;place-items:center;
  background:var(--chip);color:var(--text);
  transition:background .18s ease,color .18s ease,transform .18s ease;
}
.search-submit:hover{background:#0F0F0F;color:#fff}
.search-submit:active{transform:scale(.94)}
.topbar-right{display:flex;align-items:center;justify-content:flex-end;gap:10px;min-width:0}
.btn-create{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  height:40px;padding:0 17px;border-radius:999px;
  background:#0F0F0F;color:#fff;
  font-size:14.5px;font-weight:600;letter-spacing:-.005em;
  transition:background .18s ease,transform .18s ease;
}
.btn-create:hover{background:#2A2A2A}
.btn-create:active{transform:scale(.98)}
.btn-create .icon{width:18px;height:18px;stroke-width:2}
.icon-btn{
  position:relative;width:42px;height:42px;border-radius:50%;
  display:grid;place-items:center;color:#3C3C3C;
  transition:background .18s ease;
}
.icon-btn:hover{background:var(--chip)}
.icon-btn .icon{width:21px;height:21px}
.badge{
  position:absolute;top:2px;right:1px;
  min-width:17px;height:17px;padding:0 4px;
  display:grid;place-items:center;
  background:var(--red);color:#fff;
  border:2px solid #fff;border-radius:999px;
  font-size:10px;font-weight:700;line-height:1;
}
.avatar-btn{position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.avatar{
  width:38px;height:38px;border-radius:50%;
  display:grid;place-items:center;overflow:hidden;
  background:linear-gradient(140deg,#FF8A6B 0%,#FF3D5E 52%,#D5002B 100%);
  color:#fff;font-size:12.5px;font-weight:700;letter-spacing:.03em;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);
}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.avatar-btn:hover .avatar{box-shadow:0 0 0 3px #F3F3F3}
.avatar-dot{
  position:absolute;right:1px;bottom:1px;width:10px;height:10px;
  background:#20A46A;border:2px solid #fff;border-radius:50%;
}

/* Header popovers */
.menu-anchor{position:relative;display:flex;align-items:center}
.popover{
  position:absolute;top:calc(100% + 10px);right:0;
  background:#fff;border:1px solid #ECECEC;border-radius:16px;
  box-shadow:0 18px 50px rgba(15,15,15,.14);
  padding:8px;z-index:150;
  animation:popIn .16s ease both;
}
@keyframes popIn{from{opacity:0;transform:translateY(-6px) scale(.985)}to{opacity:1;transform:none}}
.notif-popover{width:min(360px,calc(100vw - 24px));padding:0;overflow:hidden}
.notif-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:16px 16px 12px;
}
.notif-head h2{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em}
.text-btn{font-size:12.5px;font-weight:600;color:#606060;padding:4px 6px;border-radius:7px}
.text-btn:hover{background:#F4F4F4;color:#0F0F0F}
.text-btn:disabled{color:#9A9A9A;cursor:default}
.text-btn:disabled:hover{background:none}
.notif-list{display:flex;flex-direction:column}
.notif-item{
  display:flex;gap:10px;align-items:flex-start;width:100%;
  padding:12px 16px;text-align:left;transition:background .15s ease;
}
.notif-item:hover{background:#FAFAFA}
.notif-dot{width:7px;height:7px;border-radius:50%;background:var(--red);margin-top:6px;flex:none}
.notif-item.read .notif-dot{background:#D9D9D9}
.notif-copy{min-width:0}
.notif-copy p{margin:0;font-size:13.5px;line-height:1.45;color:#3A3A3A}
.notif-copy span{display:block;margin-top:3px;font-size:12px;color:#8A8A8A}
.notif-foot{
  width:100%;padding:13px;border-top:1px solid #F0F0F0;
  font-size:13px;font-weight:600;color:#0F0F0F;text-align:center;
}
.notif-foot:hover{background:#FAFAFA}
.popover-item{
  display:flex;align-items:center;gap:11px;width:100%;
  padding:10px 10px;border-radius:9px;
  font-size:14px;font-weight:500;text-align:left;color:#2F2F2F;
}
.popover-item:hover{background:#F5F5F5}
.popover-item .icon{width:18px;height:18px;color:#6A6A6A}
.popover-item.danger{color:#D92D20}
.popover-item.danger .icon{color:#D92D20}
.popover-item.is-fav .icon{fill:currentColor}
.popover-sep{height:1px;background:#F0F0F0;margin:6px 4px}

/* ---------- Sidebar ---------- */
.sidebar{
  position:fixed;top:var(--header-h);left:0;bottom:0;width:var(--sidebar-w);
  display:flex;flex-direction:column;
  padding:20px 14px 18px;
  background:#fff;border-right:1px solid #EDEDED;
  overflow-y:auto;overscroll-behavior:contain;
  z-index:90;scrollbar-width:thin;
}
.sidebar::-webkit-scrollbar{width:5px}
.sidebar::-webkit-scrollbar-thumb{background:#E3E3E3;border-radius:9px}
.side-group{margin-bottom:22px}
.side-label{
  margin:0 0 8px;padding:0 12px;
  font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#939393;
}
.side-label-row{display:flex;align-items:center;justify-content:space-between;padding-right:8px}
.side-label-row .side-label{padding:0 12px}
.mini-add{
  width:24px;height:24px;border-radius:7px;
  display:grid;place-items:center;color:#7A7A7A;
}
.mini-add:hover{background:#F2F2F2;color:#0F0F0F}
.mini-add .icon{width:15px;height:15px;stroke-width:2}
.side-link{
  display:flex;align-items:center;gap:12px;
  height:40px;padding:0 12px;border-radius:10px;
  color:#454545;font-size:14.5px;font-weight:500;
  transition:background .15s ease,color .15s ease;
}
.side-link .icon{width:19px;height:19px;color:#6E6E6E;stroke-width:1.75}
.side-link:hover{background:#F7F7F7;color:#0F0F0F}
.side-link:hover .icon{color:#0F0F0F}
.side-link.active{background:#F2F2F2;color:#0F0F0F;font-weight:600}
.side-link.active .icon{color:#0F0F0F}
.side-count{
  margin-left:auto;padding:2px 7px;border-radius:999px;
  background:#ECECEC;color:#555;
  font-size:11px;font-weight:600;line-height:1.4;
}
.side-link.active .side-count{background:#fff;color:#0F0F0F}
.class-link{
  display:flex;align-items:center;gap:10px;
  padding:8px 12px;border-radius:9px;
  font-size:13.5px;color:#4C4C4C;
  transition:background .15s ease;
}
.class-link:hover{background:#F7F7F7}
.class-dot{width:8px;height:8px;border-radius:50%;background:var(--c,#1E7A5A);flex:none}
.class-name{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.class-count{margin-left:auto;font-size:11.5px;color:#8E8E8E;flex:none}
.side-footer{margin-top:auto;padding-top:14px;border-top:1px solid #F0F0F0}
.sidebar-overlay{display:none}

/* ---------- Main ---------- */
.main{margin-left:var(--sidebar-w);padding-top:var(--header-h);min-height:100vh}
.catbar{
  position:sticky;top:var(--header-h);z-index:40;
  height:80px;display:flex;align-items:center;
  padding-left:40px;
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(10px);
}
.cat-scroll{
  display:flex;align-items:center;gap:16px;
  height:100%;width:100%;
  padding:0 96px 0 0;
  overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;-ms-overflow-style:none;
  scroll-behavior:smooth;
  scroll-padding-left:8px;
}
.cat-scroll::-webkit-scrollbar{display:none}
.cat-pill{
  flex:none;height:42px;padding:0 22px;
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--chip);color:#0F0F0F;
  border-radius:12px;
  font-size:16px;font-weight:500;letter-spacing:-.005em;
  white-space:nowrap;
  transition:background .18s ease,color .18s ease,transform .18s ease;
}
.cat-pill:hover{background:#E9E9E9}
.cat-pill:active{transform:scale(.98)}
.cat-pill[aria-pressed="true"]{background:#0F0F0F;color:#fff}
.cat-pill[aria-pressed="true"]:hover{background:#242424}
.cat-arrow{
  position:absolute;top:50%;transform:translateY(-50%);
  width:38px;height:38px;border-radius:50%;
  display:grid;place-items:center;
  background:#fff;border:1px solid #E3E3E3;
  box-shadow:0 2px 12px rgba(15,15,15,.09);
  color:#0F0F0F;z-index:5;
  transition:background .16s ease,color .16s ease,border-color .16s ease;
}
.cat-arrow:hover{background:#0F0F0F;border-color:#0F0F0F;color:#fff}
.cat-arrow .icon{width:18px;height:18px;stroke-width:1.9}
#catPrev{left:12px}
#catNext{right:20px}
.cat-fade{position:absolute;top:0;bottom:0;width:92px;pointer-events:none;z-index:4}
.cat-fade.left{left:0;background:linear-gradient(90deg,#fff 34%,rgba(255,255,255,0))}
.cat-fade.right{right:0;background:linear-gradient(270deg,#fff 36%,rgba(255,255,255,0))}
.content{max-width:1680px;margin:0 auto;padding:30px 40px 96px}

/* ---------- Tool grid ---------- */
.tool-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  column-gap:20px;row-gap:46px;
}
.tool-card{min-width:0;animation:cardIn .42s cubic-bezier(.2,.7,.3,1) both;animation-delay:calc(var(--i,0) * 34ms)}
.tool-card[data-content-id]{cursor:pointer}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.thumb{
  position:relative;display:block;width:100%;aspect-ratio:16/9;
  padding:0;overflow:hidden;border-radius:16px;
  background:#F2F2F2;isolation:isolate;
  box-shadow:inset 0 0 0 1px rgba(15,15,15,.035);
  transition:box-shadow .3s ease,transform .3s ease;
}
.tool-card:hover .thumb{box-shadow:0 14px 34px rgba(15,15,15,.13),inset 0 0 0 1px rgba(15,15,15,.035)}
.art-svg{width:100%;height:100%;display:block;transition:transform .5s cubic-bezier(.2,.7,.3,1)}
.tool-card:hover .art-svg{transform:scale(1.025)}
.thumb-cta{
  position:absolute;left:14px;bottom:14px;z-index:2;
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 12px;border-radius:999px;
  background:rgba(255,255,255,.95);color:#0F0F0F;
  box-shadow:0 4px 18px rgba(15,15,15,.12);
  font-size:12.5px;font-weight:600;
  opacity:0;transform:translateY(6px);
  transition:opacity .2s ease,transform .2s ease;
  backdrop-filter:blur(8px);
}
.thumb-cta .icon{width:14px;height:14px;stroke-width:2}
.tool-card:hover .thumb-cta,.thumb:focus-visible .thumb-cta{opacity:1;transform:none}
.tool-info{
  display:grid;grid-template-columns:38px minmax(0,1fr);
  gap:12px;align-items:start;padding-top:14px;
}
.creator-avatar{
  position:relative;
  width:38px;height:38px;border-radius:50%;
  display:grid;place-items:center;
  background:var(--cat-bg,#F2F2F2);color:var(--cat-fg,#0F0F0F);
  margin-top:1px;flex:none;
  font-size:13px;font-weight:700;letter-spacing:.02em;
  box-shadow:inset 0 0 0 1px rgba(15,15,15,.05);
  transition:transform .16s ease,box-shadow .16s ease;
}
.creator-avatar:hover{transform:translateY(-1px);box-shadow:0 5px 16px rgba(15,15,15,.16),inset 0 0 0 1px rgba(15,15,15,.04)}
.creator-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.creator-avatar::before{
  content:"";position:absolute;left:50%;bottom:calc(100% + 5px);
  width:9px;height:9px;background:#0F0F0F;border-radius:2px;
  transform:translate(-50%,3px) rotate(45deg);
  opacity:0;pointer-events:none;z-index:60;
  transition:opacity .15s ease,transform .15s ease;
}
.creator-avatar::after{
  content:attr(data-name);
  position:absolute;left:50%;bottom:calc(100% + 10px);
  transform:translate(-50%,3px);
  padding:7px 11px;border-radius:8px;
  background:#0F0F0F;color:#fff;
  font-size:12.5px;font-weight:500;letter-spacing:0;white-space:nowrap;
  opacity:0;pointer-events:none;z-index:61;
  transition:opacity .15s ease,transform .15s ease;
}
.creator-avatar:hover::before,.creator-avatar:focus-visible::before{opacity:1;transform:translate(-50%,0) rotate(45deg)}
.creator-avatar:hover::after,.creator-avatar:focus-visible::after{opacity:1;transform:translate(-50%,0)}
.creator-avatar--lg{width:46px;height:46px;font-size:15px}
.tool-main{min-width:0}
.tool-header{display:flex;align-items:flex-start;gap:6px}
.tool-title-btn{
  flex:1;min-width:0;padding:0;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  text-align:left;
  font-size:18px;font-weight:600;line-height:1.32;letter-spacing:-.014em;color:#0F0F0F;
}
.tool-title-btn:hover{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px}
.tool-menu-btn{
  width:30px;height:30px;flex:none;margin:-5px -4px 0 0;
  border-radius:50%;display:grid;place-items:center;color:#7A7A7A;
  transition:background .15s ease,color .15s ease;
}
.tool-menu-btn:hover{background:#F3F3F3;color:#0F0F0F}
.tool-menu-btn .icon{width:18px;height:18px}
.tool-menu-btn[aria-expanded="true"]{background:#F2F2F2;color:#0F0F0F}
.tool-meta{
  margin:5px 0 0;display:flex;align-items:center;flex-wrap:wrap;gap:6px;
  font-size:14px;line-height:1.4;color:var(--muted);
}
.tool-meta .sep{color:#B3B3B3}
.tool-creator{color:inherit;transition:color .15s ease}
.tool-creator:hover{text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1.5px}
.empty-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:76px 24px 96px;
}
.empty-icon{
  width:66px;height:66px;border-radius:50%;
  display:grid;place-items:center;
  background:#F4F4F4;color:#606060;margin-bottom:18px;
}
.empty-icon .icon{width:26px;height:26px}
.empty-state h2{margin:0;font-size:21px;font-weight:600;letter-spacing:-.02em}
.empty-state p{margin:8px 0 20px;max-width:380px;font-size:14.5px;color:#606060}
.btn-primary{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:44px;padding:0 20px;border-radius:999px;
  background:#0F0F0F;color:#fff;
  font-size:14.5px;font-weight:600;
  transition:background .18s ease,transform .18s ease;
}
.btn-primary:hover{background:#2A2A2A}
.btn-primary:active{transform:scale(.98)}
.btn-primary .icon{width:17px;height:17px}
.btn-secondary{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:44px;padding:0 18px;border-radius:999px;
  background:#fff;border:1px solid #E0E0E0;color:#0F0F0F;
  font-size:14.5px;font-weight:600;
  transition:background .18s ease,border-color .18s ease;
}
.btn-secondary:hover{background:#F6F6F6}
.btn-secondary .icon{width:17px;height:17px}
.btn-secondary.is-fav{background:#FFF0F3;border-color:#FFCED8;color:#C50028}
.btn-secondary.is-fav .icon{fill:currentColor}

/* ---------- Tool menu ---------- */
.tool-menu{
  position:fixed;top:0;left:0;right:auto;
  width:216px;padding:8px;z-index:300;
  animation:popIn .15s ease both;
}
.tool-menu .popover-item{padding:9px 10px}

/* ---------- Content and profile pages ---------- */
.doc-mode .topbar,.doc-mode .sidebar,.doc-mode .sidebar-overlay,.doc-mode .main{display:none}
.doc-view{min-height:100vh;background:#fff}
.doc-bar{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;gap:14px;
  height:var(--header-h);padding:0 24px;
  background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(10px);
}
.doc-logo{
  width:92px;height:34px;flex:none;
  display:flex;align-items:center;justify-content:center;
  border:1.5px dashed #F2B7C2;border-radius:9px;
  background:#FFF7F8;color:var(--red);
  font-size:9.5px;font-weight:700;letter-spacing:.16em;
}
.doc-bar-sep{width:1px;height:22px;background:var(--line);flex:none}
.doc-back{
  display:inline-flex;align-items:center;gap:6px;
  height:38px;padding:0 14px 0 10px;border-radius:999px;
  font-size:14px;font-weight:500;color:#3C3C3C;
  transition:background .16s ease,color .16s ease;
}
.doc-back:hover{background:var(--chip);color:var(--text)}
.doc-back .icon{width:17px;height:17px}
.doc-bar-spacer{flex:1}
.doc-bar-label{font-size:13px;color:var(--muted);white-space:nowrap}
.doc-main{max-width:1080px;margin:0 auto;padding:44px 32px 96px}
.doc-article{max-width:940px;margin:0 auto}
.doc-kicker{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.doc-type{
  display:inline-flex;align-items:center;gap:7px;
  height:32px;padding:0 13px;border-radius:9px;
  background:var(--cat-bg,#F2F2F2);color:var(--cat-fg,#0F0F0F);
  font-size:13px;font-weight:600;
}
.doc-type .icon{width:15px;height:15px;stroke-width:2}
.doc-updated{font-size:13.5px;color:var(--muted)}
.doc-title{
  margin:0;max-width:830px;
  font-size:clamp(28px,4vw,42px);font-weight:700;
  line-height:1.12;letter-spacing:-.03em;
}
.doc-byline{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-top:22px}
.doc-creator{
  display:flex;align-items:center;gap:11px;
  padding:5px 15px 5px 5px;border-radius:999px;
  border:1px solid var(--line);
  transition:background .16s ease;
}
.doc-creator:hover{background:#FAFAFA}
.doc-creator-copy{display:flex;flex-direction:column;line-height:1.25}
.doc-creator-copy strong{font-size:14px;font-weight:600}
.doc-creator-copy span{font-size:12.5px;color:var(--muted)}
.doc-detail{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted)}
.doc-detail .icon{width:16px;height:16px;color:var(--soft)}
.doc-cover{
  margin-top:30px;aspect-ratio:16/9;
  border-radius:20px;overflow:hidden;background:var(--chip);
  box-shadow:inset 0 0 0 1px rgba(15,15,15,.04);
}
.doc-cover .art-svg{width:100%;height:100%}
.doc-body{max-width:820px;margin:44px auto 0;font-size:15.5px;line-height:1.68;color:#3A3A3A}
.doc-body .doc-intro{margin:0;font-size:17px;line-height:1.6;color:#333}
.doc-body h2{margin:38px 0 12px;font-size:21px;font-weight:600;letter-spacing:-.02em;color:var(--text)}
.doc-body p{margin:10px 0}
.doc-body ul,.doc-body ol{margin:10px 0;padding-left:22px}
.doc-body li{margin:7px 0}
.doc-info-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:24px}
.doc-info{background:#FAFAFA;border:1px solid #F0F0F0;border-radius:14px;padding:14px 16px}
.doc-info span{display:block;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#8A8A8A}
.doc-info strong{display:block;margin-top:5px;font-size:15.5px;font-weight:600;color:var(--text)}
.doc-rule{border:0;border-top:1px solid var(--line);margin:32px 0}
.doc-questions{list-style:none;padding:0;margin:0;counter-reset:item}
.doc-question{border-bottom:1px solid var(--line);padding:18px 0}
.doc-question:last-child{border-bottom:0}
.doc-prompt{display:flex;gap:12px;margin:0;font-size:16px;font-weight:500;line-height:1.5;color:var(--text)}
.doc-prompt b{flex:none;font-weight:600;color:#8A8A8A}
.doc-answer-line{height:1px;background:#ECECEC;margin-top:20px}
.doc-answer-line + .doc-answer-line{margin-top:16px}
.doc-term-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.doc-term{border:1px solid var(--line);border-radius:14px;padding:16px;background:#fff}
.doc-term strong{display:block;font-size:15px;font-weight:600;color:var(--text)}
.doc-term span{display:block;margin-top:5px;font-size:13.5px;color:var(--muted)}
.doc-note{margin-top:30px;padding:16px 18px;border-radius:14px;background:#FAFAFA;border:1px solid #F0F0F0;font-size:14px;color:#555}
.doc-note strong{color:var(--text)}

/* ---------- Create modal ---------- */
body.modal-open{overflow:hidden}
.tool-modal{
  width:min(520px,calc(100vw - 32px));
  max-height:calc(100% - 48px);
  margin:auto;padding:0;border:0;border-radius:20px;
  background:#fff;color:var(--text);
  box-shadow:0 32px 90px rgba(15,15,15,.3);
  overflow:auto;
}
.tool-modal::backdrop{background:rgba(15,15,15,.46);backdrop-filter:blur(2px)}
.tool-modal[open]{animation:modalIn .18s ease both}
@keyframes modalIn{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
.tool-modal-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
  padding:24px 22px 2px 24px;
}
.tool-modal-head h2{margin:0;font-size:20px;font-weight:600;letter-spacing:-.02em}
.tool-modal-head p{margin:6px 0 0;font-size:13.5px;color:var(--muted)}
.tool-category{padding:18px 24px 0}
.tool-category label{
  display:block;margin-bottom:7px;
  font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8A8A8A;
}
.tool-select{position:relative}
.tool-select select{
  appearance:none;-webkit-appearance:none;
  width:100%;height:46px;padding:0 42px 0 14px;
  border:1px solid #E1E1E1;border-radius:12px;background:#fff;
  font:500 14.5px/1 var(--font);color:var(--text);cursor:pointer;
  transition:border-color .16s ease,box-shadow .16s ease;
}
.tool-select select:hover{border-color:#C9C9C9}
.tool-select select:focus-visible{outline:0;border-color:#0F0F0F;box-shadow:0 0 0 3px rgba(15,15,15,.06)}
.tool-select > .icon{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  width:18px;height:18px;color:#6A6A6A;pointer-events:none;
}
.modal-close{
  width:36px;height:36px;border-radius:50%;flex:none;
  display:grid;place-items:center;color:#5A5A5A;
  transition:background .16s ease,color .16s ease;
}
.modal-close:hover{background:var(--chip);color:var(--text)}
.modal-close .icon{width:19px;height:19px}
.tool-list{display:flex;flex-direction:column;gap:4px;padding:12px 14px 20px}
.tool-option{
  display:flex;align-items:center;gap:14px;width:100%;
  padding:12px;border-radius:14px;text-align:left;
  transition:background .16s ease;
}
.tool-option:hover{background:#F7F7F7}
.tool-option:focus-visible{outline-offset:-2px}
.tool-option-ic{
  width:44px;height:44px;border-radius:12px;flex:none;
  display:grid;place-items:center;
  background:var(--tool-bg,#F2F2F2);color:var(--tool-fg,#0F0F0F);
}
.tool-option-ic .icon{width:22px;height:22px}
.tool-option-copy{flex:1;min-width:0}
.tool-option-copy strong{display:block;font-size:15px;font-weight:600;letter-spacing:-.01em}
.tool-option-copy span{display:block;margin-top:2px;font-size:13px;line-height:1.35;color:var(--muted)}
.tool-option-go{
  display:inline-flex;align-items:center;gap:5px;flex:none;
  font-size:12.5px;font-weight:600;color:#8A8A8A;
  transition:color .16s ease;
}
.tool-option-go .icon{width:16px;height:16px}
.tool-option:hover .tool-option-go{color:var(--text)}
.tool-option.is-soon .tool-option-ic{opacity:.6}
.tool-option.is-soon .tool-option-copy strong{color:#4A4A4A}
.tool-soon{
  flex:none;height:26px;padding:0 10px;border-radius:999px;
  display:inline-flex;align-items:center;
  background:var(--chip);color:#7A7A7A;
  font-size:11.5px;font-weight:600;letter-spacing:.02em;
}
.tool-empty{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:32px 24px 30px;text-align:center;
}
.tool-empty .icon{width:26px;height:26px;color:#BFBFBF;margin-bottom:6px}
.tool-empty strong{font-size:14.5px;font-weight:600}
.tool-empty span{font-size:13px;line-height:1.4;color:var(--muted)}

/* ---------- Builder workspace ---------- */
.builder-mode{overflow:hidden}
.builder-mode .main,.builder-mode .sidebar,.builder-mode .sidebar-overlay,.builder-mode .menu-toggle{display:none}
.builder-view{position:fixed;inset:var(--header-h) 0 0 0;background:#F4F5F7;z-index:1}
.builder-view iframe{display:block;width:100%;height:100%;border:0;background:#F4F5F7}

/* ---------- Toast ---------- */
.toast{
  position:fixed;left:50%;bottom:28px;z-index:400;
  display:flex;align-items:center;gap:8px;
  max-width:calc(100vw - 32px);
  padding:11px 18px;border-radius:999px;
  background:#0F0F0F;color:#fff;
  box-shadow:0 14px 34px rgba(0,0,0,.24);
  font-size:13.5px;font-weight:500;
  opacity:0;pointer-events:none;
  transform:translate(-50%,14px);
  transition:opacity .22s ease,transform .22s ease;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast .icon{width:16px;height:16px;color:#63E6A8;stroke-width:2.2}

/* ---------- Responsive ---------- */
@media (max-width:1360px){
  .catbar{padding-left:32px}
  .content{padding:28px 32px 80px}
}
@media (max-width:1180px){
  .tool-grid{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:40px}
}
@media (max-width:980px){
  .topbar{grid-template-columns:auto minmax(0,1fr) auto;gap:12px;padding:0 16px}
  .menu-toggle{display:flex}
  .logo-slot{width:112px;height:36px}
  .search-zone{max-width:none}
  .btn-create{width:42px;height:42px;padding:0;border-radius:50%}
  .btn-create .btn-label{display:none}
  .main{margin-left:0}
  .sidebar{transform:translateX(-104%);transition:transform .28s cubic-bezier(.2,.7,.3,1),box-shadow .28s ease;z-index:95;box-shadow:none}
  body.nav-open .sidebar{transform:none;box-shadow:0 24px 60px rgba(0,0,0,.18)}
  .sidebar-overlay{
    display:block;position:fixed;inset:var(--header-h) 0 0 0;
    background:rgba(15,15,15,.34);z-index:85;
    opacity:0;pointer-events:none;transition:opacity .24s ease;
  }
  body.nav-open .sidebar-overlay{opacity:1;pointer-events:auto}
  body.nav-open{overflow:hidden}
  .catbar{padding-left:24px}
  .content{padding:26px 24px 76px}
}
@media (max-width:760px){
  .topbar{gap:10px;padding:0 14px}
  .logo-slot{width:88px;height:36px;font-size:10px}
  .search-shell{height:48px;padding-left:16px}
  .catbar{height:76px;padding-left:20px}
  .cat-pill{height:40px;padding:0 19px;font-size:15px}
  .cat-scroll{padding-right:78px;gap:13px}
  #catNext{right:14px;width:36px;height:36px}
  #catPrev{left:10px;width:36px;height:36px}
  .content{padding:24px 20px 72px}
  .doc-main{padding:36px 24px 80px}
  .doc-byline{gap:14px}
}
@media (max-width:700px){
  .tool-grid{grid-template-columns:minmax(0,1fr);row-gap:36px}
  .content{padding:22px 20px 68px}
}
@media (max-width:560px){
  .topbar{padding:0 12px;gap:8px}
  .logo-slot{width:62px;height:34px;font-size:8.5px;letter-spacing:.14em;border-radius:9px}
  .menu-toggle{width:36px;height:36px}
  .topbar-left{gap:6px}
  .topbar-right{gap:4px}
  .btn-create{width:38px;height:38px}
  .icon-btn{width:38px;height:38px}
  .icon-btn .icon{width:20px;height:20px}
  .avatar-btn{width:36px;height:36px}
  .avatar{width:34px;height:34px;font-size:11.5px}
  .search-shell{height:44px;padding:0 4px 0 14px}
  .search-input{font-size:15px}
  .search-submit{width:34px;height:34px}
  .search-submit .icon{width:18px;height:18px}
  .catbar{height:70px}
  .cat-scroll{gap:11px;padding-right:64px}
  .cat-pill{height:38px;padding:0 16px;font-size:14.5px;border-radius:11px}
  .cat-arrow{width:32px;height:32px}
  #catNext{right:10px}
  #catPrev{left:8px}
  .cat-fade{width:64px}
  .thumb{border-radius:14px}
  .tool-title-btn{font-size:17px}
  .tool-meta{font-size:13.5px}
  .doc-bar{padding:0 14px;gap:10px}
  .doc-logo{width:62px;height:32px;font-size:7.5px;letter-spacing:.1em}
  .doc-bar-label{display:none}
  .doc-back{padding:0 12px 0 8px;font-size:13.5px}
  .doc-main{padding:30px 20px 72px}
  .doc-title{font-size:27px}
  .doc-cover{border-radius:16px;margin-top:24px}
  .doc-body{margin-top:34px;font-size:15px}
  .doc-body h2{font-size:19px;margin-top:32px}
  .doc-info-grid{grid-template-columns:1fr;gap:10px}
  .doc-term-grid{grid-template-columns:1fr}
  .notif-popover{right:-46px}
}
@media (max-width:400px){
  .logo-slot{width:50px;font-size:8px;letter-spacing:.1em}
  .tool-info{grid-template-columns:34px minmax(0,1fr);gap:10px}
  .creator-avatar{width:34px;height:34px;font-size:12px}
}
@media (hover:none){
  .thumb-cta{opacity:1;transform:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-delay:0ms !important;transition-duration:.001ms !important;scroll-behavior:auto !important}
}

  const savedAll = TeacherTools.profiles.all();

const state = {
  query: '',
  active: 'all',
  order: NAV_ORDER.slice(),
  favorites: new Set()
};

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

const catScroll = $('#catScroll');
const catPrev = $('#catPrev');
const catNext = $('#catNext');
const catFadeLeft = $('#catFadeLeft');
const catFadeRight = $('#catFadeRight');
const toolGrid = $('#toolGrid');
const emptyState = $('#emptyState');
const emptyCopy = $('#emptyCopy');
const searchForm = $('#searchForm');
const searchInput = $('#searchInput');
const live = $('#live');

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, (ch) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[ch]));
}

function artHTML(type) {
  return `<svg class="art-svg" viewBox="0 0 640 360" aria-hidden="true" focusable="false">${ART[type] || ART.worksheet}</svg>`;
}

function viewsLabel(views) {
  const count = Number(views) || 0;
  return `${count.toLocaleString('en-US')} ${count === 1 ? 'view' : 'views'}`;
}

function avatarInner(user) {
  return user.avatar
    ? `<img src="${escapeHTML(user.avatar)}" alt="">`
    : escapeHTML(user.initials);
}

function relativeTime(timestamp) {
  const ms = Number(timestamp) || 0;
  if (!ms) return 'just now';
  const diff = Math.max(0, Date.now() - ms);
  const minute = 60 * 1000;
  const hour = 60 * minute;
  const day = 24 * hour;
  if (diff < minute) return 'just now';
  if (diff < hour) {
    const count = Math.floor(diff / minute);
    return `${count} ${count === 1 ? 'minute' : 'minutes'} ago`;
  }
  if (diff < day) {
    const count = Math.floor(diff / hour);
    return `${count} ${count === 1 ? 'hour' : 'hours'} ago`;
  }
  const count = Math.floor(diff / day);
  return `${count} ${count === 1 ? 'day' : 'days'} ago`;
}

function publishedContent() {
  return TeacherTools.publishing.list().map((item) => ({
    ...item,
    updated: relativeTime(item.updatedAt)
  }));
}

function allContent() {
  return publishedContent();
}

function getContent(id) {
  return allContent().find((item) => item.id === id);
}

function contentURL(id) {
  return `${location.href.split('#')[0]}#content=${id}`;
}

function profileURL(id) {
  return `${location.href.split('#')[0].replace(/[^/]*$/, '')}profile.html?user=${encodeURIComponent(id)}`;
}

function cardHTML(item, index) {
  const tool = TOOLS[item.tool] || { label: item.kind || 'Content' };
  const user = USERS[item.creator] || { name:'Teacher', initials:'?', bg:'#F2F2F2', fg:'#0F0F0F' };
  return `
    <article class="tool-card" data-content-id="${item.id}" style="--i:${index}">
      <a class="thumb" href="#content=${item.id}" target="_blank" rel="noopener" aria-label="Open “${escapeHTML(item.title)}” in a new tab">
        ${artHTML(item.art)}
        <span class="thumb-cta" aria-hidden="true">
          <svg class="icon"><use href="#ic-maximize"/></svg>Open
        </span>
      </a>
      <div class="tool-info">
        <a class="creator-avatar" href="${profileURL(item.creator)}" data-name="${escapeHTML(user.name)}" aria-label="View ${escapeHTML(user.name)}’s profile" style="--cat-bg:${user.bg};--cat-fg:${user.fg}">${avatarInner(user)}</a>
        <div class="tool-main">
          <div class="tool-header">
            <a class="tool-title-btn" href="#content=${item.id}" target="_blank" rel="noopener" aria-label="Open “${escapeHTML(item.title)}” in a new tab">${escapeHTML(item.title)}</a>
            <button class="tool-menu-btn" type="button" data-menu="${item.id}" aria-haspopup="true" aria-expanded="false" aria-label="More options for ${escapeHTML(item.title)}">
              <svg class="icon" aria-hidden="true"><use href="#ic-dots"/></svg>
            </button>
          </div>
          <p class="tool-meta">
            <span>${escapeHTML(tool.label)}</span>
            <span class="sep" aria-hidden="true">·</span>
            <a class="tool-creator" href="${profileURL(item.creator)}">${escapeHTML(user.name)}</a>
            <span class="sep" aria-hidden="true">·</span>
            <span>${viewsLabel(item.views)}</span>
          </p>
        </div>
      </div>
    </article>`;
}

function matches(item) {
  if (state.active !== 'all') {
    const [type, id] = state.active.split(':');
    if (type === 'group' && item.group !== id) return false;
    if (type === 'tool' && item.tool !== id) return false;
  }
  if (!state.query) return true;
  const tool = TOOLS[item.tool];
  const group = GROUPS_BY_ID[item.group];
  const user = USERS[item.creator];
  const haystack = `${item.title} ${tool ? tool.label : ''} ${group ? group.label : ''} ${user ? user.name : ''} ${item.desc || ''}`.toLowerCase();
  return state.query.toLowerCase().split(/\s+/).filter(Boolean).every((term) => haystack.includes(term));
}

function renderTools() {
  const list = allContent().filter(matches);
  toolGrid.innerHTML = list.map(cardHTML).join('');
  toolGrid.hidden = list.length === 0;
  emptyState.hidden = list.length > 0;

  if (!list.length) {
    emptyCopy.textContent = state.query
      ? `No content matches “${state.query}”${state.active === 'all' ? '' : ` in ${NAV_BY_KEY[state.active].label}`}. Try a different keyword or category.`
      : state.active === 'all'
        ? 'Published content will appear here once teachers post it.'
        : `There is no content in ${NAV_BY_KEY[state.active].label} yet.`;
  }

  live.textContent = `${list.length} ${list.length === 1 ? 'content item' : 'content items'} shown${state.query ? ` for ${state.query}` : ''}.`;
  closeToolMenu();
}

function renderCategories(focusKey) {
  catScroll.innerHTML = state.order.map((key) => `
    <button class="cat-pill" type="button" data-cat="${key}" aria-pressed="${state.active === key}">
      ${escapeHTML(NAV_BY_KEY[key].label)}
    </button>`).join('');

  if (focusKey) {
    const active = catScroll.querySelector(`[data-cat="${focusKey}"]`);
    if (active) active.focus({ preventScroll: true });
  }
  requestAnimationFrame(updateCatArrows);
}

function scrollPageTopIfNeeded() {
  if (window.scrollY > 90) window.scrollTo({ top: 0, behavior: 'smooth' });
}

function selectCategory(key) {
  const changed = state.active !== key || state.order[1] !== key;
  state.active = key;
  state.order = ['all', ...(key === 'all' ? [] : [key]), ...state.order.filter((item) => item !== 'all' && item !== key)];
  renderCategories(key);
  renderTools();
  catScroll.scrollTo({ left: 0, behavior: 'smooth' });
  if (changed) scrollPageTopIfNeeded();
}

function clearFilters() {
  state.query = '';
  state.active = 'all';
  state.order = NAV_ORDER.slice();
  searchInput.value = '';
  renderCategories();
  renderTools();
}

function updateCatArrows() {
  const max = catScroll.scrollWidth - catScroll.clientWidth;
  const canScroll = max > 4;
  const atStart = catScroll.scrollLeft <= 4;
  const atEnd = catScroll.scrollLeft >= max - 4;

  catPrev.hidden = !(canScroll && !atStart);
  catNext.hidden = !(canScroll && !atEnd);
  catFadeLeft.hidden = !(canScroll && !atStart);
  catFadeRight.hidden = !(canScroll && !atEnd);
}

catScroll.addEventListener('scroll', updateCatArrows, { passive: true });

catNext.addEventListener('click', () => {
  catScroll.scrollBy({ left: Math.max(240, catScroll.clientWidth * 0.7), behavior: 'smooth' });
});

catPrev.addEventListener('click', () => {
  catScroll.scrollBy({ left: -Math.max(240, catScroll.clientWidth * 0.7), behavior: 'smooth' });
});

catScroll.addEventListener('click', (event) => {
  const pill = event.target.closest('[data-cat]');
  if (pill) selectCategory(pill.dataset.cat);
});

/* ---------- Content menu ---------- */
const toolMenu = $('#toolMenu');
let menuContentId = null;
let menuAnchor = null;

function updateToolMenuFavorite() {
  const item = toolMenu.querySelector('[data-action="favorite"]');
  const isFav = state.favorites.has(menuContentId);
  item.classList.toggle('is-fav', isFav);
  item.querySelector('span').textContent = isFav ? 'Remove from favorites' : 'Add to favorites';
}

function positionToolMenu(button) {
  const rect = button.getBoundingClientRect();
  const menuRect = toolMenu.getBoundingClientRect();
  let top = rect.bottom + 8;
  if (top + menuRect.height > window.innerHeight - 12) top = rect.top - menuRect.height - 8;
  const left = Math.max(12, Math.min(rect.right - menuRect.width, window.innerWidth - menuRect.width - 12));
  toolMenu.style.top = `${Math.max(12, top)}px`;
  toolMenu.style.left = `${left}px`;
}

function openToolMenu(button, id) {
  closeHeaderMenus();
  closeToolMenu();
  menuContentId = id;
  menuAnchor = button;
  toolMenu.hidden = false;
  updateToolMenuFavorite();
  positionToolMenu(button);
  button.setAttribute('aria-expanded', 'true');
}

function closeToolMenu() {
  if (toolMenu.hidden) return;
  toolMenu.hidden = true;
  if (menuAnchor) menuAnchor.setAttribute('aria-expanded', 'false');
  menuAnchor = null;
  menuContentId = null;
}

function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
  const area = document.createElement('textarea');
  area.value = text;
  area.style.position = 'fixed';
  area.style.opacity = '0';
  document.body.appendChild(area);
  area.select();
  try { document.execCommand('copy'); } finally { area.remove(); }
  return Promise.resolve();
}

toolMenu.addEventListener('click', async (event) => {
  const item = event.target.closest('[data-action]');
  if (!item) return;
  const action = item.dataset.action;
  const content = getContent(menuContentId);
  if (!content) return;

  if (action === 'open') {
    closeToolMenu();
    window.open(contentURL(content.id), '_blank', 'noopener');
  } else if (action === 'favorite') {
    if (state.favorites.has(content.id)) {
      state.favorites.delete(content.id);
      showToast(`Removed “${content.title}” from favorites.`);
    } else {
      state.favorites.add(content.id);
      showToast(`Added “${content.title}” to favorites.`);
    }
    closeToolMenu();
  } else if (action === 'copy') {
    closeToolMenu();
    try {
      await copyText(contentURL(content.id));
      showToast('Content link copied to clipboard.');
    } catch {
      showToast('Could not copy the link. Try again.');
    }
  }
});

function loadBuilder(kind) {
  const builder = BUILDERS[kind];
  if (!builder) return false;
  Object.entries(BUILDERS).forEach(([id, item]) => { item.frame.hidden = id !== kind; });
  if (!builder.themeHooked) {
    builder.frame.addEventListener('load', () => TeacherTools.theme.notifyFrame(builder.frame));
    builder.themeHooked = true;
  }
  if (!builderLoaded.has(kind)) {
    builder.frame.src = builder.frame.dataset.src;
    builderLoaded.add(kind);
  } else {
    TeacherTools.theme.notifyFrame(builder.frame);
  }
  activeBuilder = kind;
  return true;
}

        <div class="doc-byline">
          <a class="doc-creator" href="${profileURL(item.creator)}">
            <span class="creator-avatar creator-avatar--lg" data-name="${escapeHTML(user.name)}" style="--cat-bg:${user.bg};--cat-fg:${user.fg}">${avatarInner(user)}</span>
            <span class="doc-creator-copy">
              <strong>${escapeHTML(user.name)}</strong>
              <span>${escapeHTML(user.role)} · ${escapeHTML(user.school)}</span>
            </span>
          </a>
          <span class="doc-detail">
            <svg class="icon" aria-hidden="true"><use href="#ic-${tool.icon}"/></svg>${escapeHTML(item.detail)}
          </span>
        </div>
        <div class="doc-cover">${artHTML(item.art)}</div>
        <div class="doc-body">${docBodyHTML(item)}</div>
      </article>
    </main>`;
  document.title = `${item.title} — Teacher Tools`;
  return true;
}

function route() {
  const hash = location.hash.replace(/^#/, '');
  const [mode, ...rest] = hash.split('=');
  const value = rest.join('=');
  let rendered = false;
  let inBuilder = false;

  if (mode === 'content') rendered = renderContentPage(value);
  else if (mode === 'builder' && BUILDERS[value]) {
    inBuilder = loadBuilder(value);
  }

  document.body.classList.toggle('doc-mode', rendered);
  document.body.classList.toggle('builder-mode', inBuilder);
  docView.hidden = !rendered;
  builderView.hidden = !inBuilder;

  if (!rendered && !inBuilder) {
    docView.innerHTML = '';
    document.title = homeTitle;
    renderTools();
    if (hash === 'home') window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }

  closeToolMenu();
  closeHeaderMenus();
  closeToolModal();
  setDrawer(false);
  window.scrollTo(0, 0);
  if (inBuilder) document.title = `${BUILDERS[activeBuilder].title} — Teacher Tools`;
}

window.addEventListener('hashchange', route);

docView.addEventListener('click', (event) => {
  if (event.target.closest('a, button')) return;
  const card = event.target.closest('[data-content-id]');
  if (card) window.open(contentURL(card.dataset.contentId), '_blank', 'noopener');
});

/* ---------- Toast ---------- */
const toast = $('#toast');
const toastText = $('#toastText');
let toastTimer = null;

function showToast(message) {
  toastText.textContent = message;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2800);
}

/* ---------- Global shortcuts ---------- */
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape') {
    closeToolMenu();
    closeHeaderMenus();
    setDrawer(false);
  }

  const tag = document.activeElement ? document.activeElement.tagName : '';
  const typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
  if (event.key === '/' && !typing && !document.body.classList.contains('doc-mode')) {
    event.preventDefault();
    searchInput.focus();
  }
});

window.addEventListener('scroll', () => {
  closeToolMenu();
  closeHeaderMenus();
}, true);

/* ---------- Cross-tab / cross-frame sync ---------- */
window.addEventListener('storage', (event) => {
  if (!event.key || !event.key.startsWith('teacherTools.')) return;
  applySavedProfiles();
  syncAccount();
  syncThemeButtons();
  syncNotifications();
  renderTools();
});

window.addEventListener('message', (event) => {
  const data = event.data;
  if (!data || data.type !== 'teachertools:published') return;
  const item = data.item || {};
  const title = item.title || 'Content';
  renderTools();
  if (data.duplicate) showToast(`“${title}” updated on the website.`);
  else showToast(`“${title}” posted to the website.`);
});

/* ---------- Init ---------- */
syncThemeButtons();
syncAccount();

renderCategories();
renderTools();
syncNotifications();
route();
new ResizeObserver(() => updateCatArrows()).observe(catScroll);
window.addEventListener('load', updateCatArrows);
</script>
</body>
</html>
